[project]
name = "monte-carlo-stock-sim"
version = "0.1.0"
description = "Monte Carlo simulation of NSE stocks, portfolios and strategy risk, with model validation against real data."
readme = "README.md"
license = "MIT"
authors = [{ name = "Dhirajdas18" }]
requires-python = ">=3.12"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "yfinance",
]

[project.scripts]
mc-report = "mc.reports:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mc"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
